[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nai-security"
version = "1.13.0"
description = "Django security app - IP/email/country blocking, rate limiting, login tracking, auto-blocking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Ali Nemati", email = "alinemati@nemati.ai"}
]
keywords = [
    "django",
    "security",
    "ip-blocking",
    "rate-limiting",
    "country-blocking",
    "email-blocking",
    "login-tracking",
    "geoip",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "django>=4.2",
    "geoip2>=5.0,<6",
    "redis>=5.0,<9",
    "requests>=2.28",
]

[project.optional-dependencies]
axes = ["django-axes>=8.3.1,<9.0"]
ratelimit = ["django-ratelimit>=4.1"]
import-export = ["django-import-export>=4.0,<5"]
unfold = ["django-unfold>=0.90"]
all = [
    "django-axes>=8.3.1,<9.0",
    "django-ratelimit>=4.1",
    "django-import-export>=4.0,<5",
    "django-unfold>=0.90",
]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "packaging>=24.0",
    "black>=25.0",
    "ruff>=0.9",
]
docs = ["mkdocs-material>=9.6"]

[project.urls]
Homepage = "https://github.com/nematiai/nai-security"
Documentation = "https://nematiai.github.io/nai-security/"
Repository = "https://github.com/nematiai/nai-security"
Issues = "https://github.com/nematiai/nai-security/issues"
"NEMATI AI" = "https://nemati.ai"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.setuptools.packages.find]
where = ["."]
include = ["nai_security*"]

[tool.setuptools.package-data]
nai_security = ["py.typed"]
