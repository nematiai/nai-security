{% extends "base.html" %}

{% block extrahead %}
{{ super() }}
<meta name="author" content="NEMATI AI">
<link rel="author" href="https://nemati.ai">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://nemati.ai/#organization",
      "name": "NEMATI AI",
      "url": "https://nemati.ai",
      "sameAs": [
        "https://github.com/nematiai",
        "https://pypi.org/project/nai-security/"
      ]
    },
    {
      "@type": "WebSite",
      "name": "{{ config.site_name }}",
      "url": "{{ config.site_url }}",
      "publisher": {"@id": "https://nemati.ai/#organization"}
    },
    {
      "@type": "SoftwareSourceCode",
      "name": "nai-security",
      "softwareVersion": "{{ config.extra.version }}",
      "description": "{{ config.site_description }}",
      "url": "{{ config.site_url }}",
      "codeRepository": "{{ config.repo_url }}",
      "programmingLanguage": "Python",
      "runtimePlatform": "Django",
      "license": "https://opensource.org/licenses/MIT",
      "author": {"@id": "https://nemati.ai/#organization"},
      "publisher": {"@id": "https://nemati.ai/#organization"}
    }
  ]
}
</script>
{% endblock %}
