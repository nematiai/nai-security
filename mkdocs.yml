site_name: NAI Security
site_url: https://nematiai.github.io/nai-security/
site_description: Django security package for IP, country, and email blocking, GeoIP, rate-limit logging, and django-axes lockout.
site_author: NEMATI AI
repo_url: https://github.com/nematiai/nai-security
repo_name: nematiai/nai-security
copyright: '<a href="https://nemati.ai">NEMATI AI</a> · MIT'

docs_dir: .docs-build
site_dir: site

theme:
  name: material
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: System theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Installation: Installation.md
  - Configuration: Configuration.md
  - Admin Guide: Admin-Guide.md
  - Axes Integration: Axes-Integration.md
  - Whitelisting: Whitelisting.md
  - Management Commands: Management-Commands.md
  - Celery Tasks: Celery-Tasks.md
  - Upgrading: Upgrading.md

plugins:
  - search
  - privacy:
      enabled: !ENV [CI, false]

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

extra_css:
  - stylesheets/extra.css

extra:
  version: "1.13.0"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nematiai/nai-security
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/nai-security/
      name: PyPI
    - icon: fontawesome/solid/globe
      link: https://nemati.ai
      name: NEMATI AI
