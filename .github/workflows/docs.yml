name: Docs

on:
  push:
    branches: [main, production]
    paths:
      - wiki/**
      - mkdocs.yml
      - tools/prepare_docs.py
      - tools/mkdocs_hooks.py
      - overrides/**
      - docs/assets/**
      - google4e3f9dd160c3aab0.html
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: pip install "mkdocs-material>=9.6"
      - name: Prepare pages from wiki
        run: python tools/prepare_docs.py
      - name: Build
        run: mkdocs build --strict
        env:
          CI: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
