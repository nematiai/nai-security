[tox]
envlist = py311, py312, py313, py314, build
skip_missing_interpreters = true
minversion = 4.0

[testenv]
extras =
    all
    dev
package = editable
setenv =
    PYTHONPATH = {toxinidir}
commands =
    pytest -q --cov=nai_security --cov-report=term-missing --cov-fail-under=80

[testenv:build]
skip_install = true
deps =
    build>=1.2
    twine>=5.0
commands =
    python -m build --outdir {toxinidir}/dist
    twine check {toxinidir}/dist/*
